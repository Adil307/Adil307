name: Generate Snake

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

concurrency:
  group: profile-snake-writer
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate animated contribution SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Adil307
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake-live.svg?palette=github-dark
      - name: Update stable local SVG on main
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/snake-live.svg
          cp dist/snake-live.svg assets/snake-live.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/snake-live.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh contribution snake SVG'
          git pull --rebase origin main
          git push origin HEAD:main
