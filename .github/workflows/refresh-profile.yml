name: Refresh premium profile stats

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-profile.yml'
      - 'scripts/build_profile_stats.py'

permissions:
  contents: write

concurrency:
  group: premium-profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build charts from public GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_profile_stats.py
      - name: Commit refreshed chart SVGs only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats-live.svg assets/languages-live.svg assets/activity-live.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public profile charts'
          git push
